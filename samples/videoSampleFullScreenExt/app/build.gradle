apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'

Properties versionProperties = new Properties()
versionProperties.load(project.rootProject.file('../versions.properties').newDataInputStream())
def adsiwzzVersion = versionProperties["adsiwzzVersion"]

android {
    compileSdk 35

    namespace "com.adswizz.videosamplefull"
    defaultConfig {
        applicationId "com.adswizz.videosamplefullscreen"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        ndkVersion '21.3.6528147'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "com.adswizz:adswizz-sdk:$adsiwzzVersion"
    implementation "com.adswizz:exoplayer2x:$adsiwzzVersion"

    implementation "com.google.android.exoplayer:exoplayer:2.19.1"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
