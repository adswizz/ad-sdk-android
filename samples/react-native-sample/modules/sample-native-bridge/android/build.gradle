plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

dependencies {
  implementation "com.adswizz:adswizz-sdk:8.2.7"
  implementation "com.adswizz:exoplayer-media3:8.2.7"
}

group = 'expo.modules.samplenativebridge'
version = '0.1.0'

android {
  namespace "expo.modules.samplenativebridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
