    <!-- Stylesheets -->

    <!-- Test Stylesheets -->

	<style type="text/css">
		a.github-corner { visibility: hidden;}
		.page_toc p.title { color:blue; }
		.page_toc a { color:blue; }
		.page_toc a.active { color:blue; }
		.page_toc a.anchor { color:blue; }
		.page_toc a:hover { color: blue; text-decoration: none;}
		.page_toc a.active:hover { color: blue; text-decoration: none;}
		.page_toc a.anchor:hover { color: blue; text-decoration: none;}
		.page_toc ul a:hover span {color:blue;}
	</style>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9LYZ7R080K"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-9LYZ7R080K');

</head>

<body>
    <div id="app"></div>

    <script>
        // Docsify
        window.$docsify = {
            // GENERAL
            // -----------------------------------------------------------------
            name       : 'Adswizz SDK',
            repo       : 'https://github.com/jhildenbiddle/docsify-themeable',
            homepage   : 'introduction.md',
            loadSidebar: '_sidebar.md',

            // NAVIGATION
            // -----------------------------------------------------------------
            alias: {
                '.*?/changelog': 'https://raw.githubusercontent.com/jhildenbiddle/docsify-themeable/master/CHANGELOG.md',
            },
            auto2top   : true,
            maxLevel   : 1,
            subMaxLevel: 1,

            // PLUGINS
            // -----------------------------------------------------------------
            executeScript: true,
            search: {
                depth      : 3,
                noData     : 'No results!',
                placeholder: 'Search...'
            },
            plugins: [
                // Restores initial <title>
                function persistTitle(hook, vm) {
                    var titleElm = document.querySelector('title');
                    var rootTitle = titleElm && titleElm.textContent;
                    var pageTitlePrefix = window.$docsify.name ? window.$docsify.name + ' - ' : '';

                    if (rootTitle) {
                        hook.doneEach(function () {
                            var currentTitle = titleElm.textContent;
                            var isRoot = !/\/[a-z]/.test(location.hash);
                            var newTitle = isRoot ? rootTitle : pageTitlePrefix + currentTitle;

                            titleElm.textContent = newTitle;
                        });
                    }
                }
            ],
            toc: {
    			scope: '.markdown-section',
    			headings: 'h1, h2',
    			title: 'Table of Contents'
  			}
        };
    </script>
    <script src="assets/js/docsify.min.js"></script>
    <script src="assets/js/docsify-tabs.min.js"></script>
    <script src="assets/js/docsify-copy-code.min.js"></script>
    <script src="assets/js/docsify-pagination.min.js"></script>
    <script src="assets/js/external-script.min.js"></script>
    <script src="assets/jssearch.js"></script>
    <script src="assets/jszoom-image.min.js"></script>
    <script src="assets/js/prism-bash.min.js"></script>
    <script src="assets/js/prism-swift.min.js"></script>
    <script src="assets/js/prism-kotlin.min.js"></script>
    <script src="assets/js/toc.js"></script>
</body>
</html>
